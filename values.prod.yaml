# Production overrides — TLS, resource limits, Redis persistence
global:
  domain: xn--80aalycsf6f.xn--90ae
  entryPoint: websecure
  tls:
    enabled: true
    certResolver: letsencrypt

postgresql:
  instances: 1
  storage:
    size: 50Gi

redis:
  master:
    persistence:
      enabled: true       # persist Redis AOF in prod
      size: 2Gi
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 200m

users-ms:
  replicaCount: 1
  image:
    pullPolicy: Always
  config:
    logLevel: INFO
    cookieSecure: "true"
  resources:
    requests:
      memory: 96Mi
      cpu: 75m
    limits:
      memory: 192Mi
      cpu: 300m

