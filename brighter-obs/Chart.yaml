apiVersion: v2
name: brighter-obs
description: BrighterProject observability stack (Tempo, Loki, Promtail, Grafana, Prometheus, OTEL Collector)
type: application
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  - name: tempo
    version: ">=1.7.0-0"
    repository: https://grafana.github.io/helm-charts
  - name: loki
    version: ">=6.0.0-0"
    repository: https://grafana.github.io/helm-charts
  - name: promtail
    version: ">=6.15.0-0"
    repository: https://grafana.github.io/helm-charts
  - name: grafana
    version: ">=8.0.0-0"
    repository: https://grafana.github.io/helm-charts
  - name: prometheus
    version: ">=25.0.0-0"
    repository: https://prometheus-community.github.io/helm-charts
