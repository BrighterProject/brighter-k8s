# ── Global values (propagated to every subchart as .Values.global.*) ──────────
global:
  domain: pochivka-na-moreto.bg
  dbSecretName: brighter-db-app
  entryPoint: web

  # Scheme used when building externally-visible URLs (Stripe redirects, email
  # links). Defaults to https when Traefik terminates TLS, http otherwise; set
  # explicitly to https when an upstream proxy (e.g. Caddy) terminates TLS while
  # Traefik still receives plain http.
  publicScheme: ""

  tls:
    enabled: false
    certResolver: letsencrypt

redis:
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
  replica:
    replicaCount: 0

postgresql:
  instances: 1
  storage:
    size: 10Gi

  credentialsSecretName: brighter-db-credentials

users-ms:
  replicaCount: 1
  image:
    repository: ghcr.io/brighterproject/brighter-users-ms
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8000
  config:
    logLevel: INFO
    accessTokenExpireMinutes: "120"
    redisUrl: redis://brighter-redis-master:6379/0
    contactEmail: ploshtadka.bg@gmail.com
    contactRateLimit: "5"
    contactRateWindow: "3600"
    googleClientId: "347686290554-c9b0dj5fpusmicbr2a1rhc41qm2a0in5.apps.googleusercontent.com"
    smtpHost: smtp.gmail.com
    smtpPort: "587"
    smtpUser: ploshtadka.bg@gmail.com
    notificationsMsUrl: http://notifications-ms:8004
    cookieSecure: "false"
    otelExporterOtlpEndpoint: "http://otel-collector:4317"
    otelSdkDisabled: "false"
  secrets:
    # provides SECRET_KEY, SMTP_PASSWORD, TURNSTILE_SECRET_KEY
    name: users-ms-secrets
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

