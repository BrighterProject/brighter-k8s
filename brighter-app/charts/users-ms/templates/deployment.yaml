apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "users-ms.fullname" . }}
  labels:
    {{- include "users-ms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "users-ms.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "users-ms.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        # Gate pod start until the DB port is reachable.
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z brighter-db-rw 5432; do sleep 2; done']
        {{- if .Values.migrations.enabled }}
        # Apply pending Tortoise migrations before the app starts. Reuses this
        # pod's already-pulled image (no separate Job, no image pull), so it adds
        # ~1-2s and runs on every rollout including `kubectl set image` — not just
        # `helm upgrade`. --no-sync skips dependency resolution (deps are baked
        # into the image); idempotent, so it is a no-op when nothing is pending.
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uv", "run", "--no-sync", "tortoise", "-c", "main.TORTOISE_ORM", "upgrade"]
          envFrom:
            - configMapRef:
                name: {{ include "users-ms.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.name }}
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.dbSecretName }}
                  key: uri
            - name: OTEL_SDK_DISABLED
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
        {{- end }}

      containers:
        - name: users-ms
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "users-ms.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.name }}
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.dbSecretName }}
                  key: uri
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # startupProbe: generous window for slow first-boot (DB migration may still run)
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          # livenessProbe: simple process-alive check — never queries DB
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # readinessProbe: checks DB connectivity; pod removed from LB if it fails
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
