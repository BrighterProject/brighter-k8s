apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "payments-ms.fullname" . }}-config
  labels:
    {{- include "payments-ms.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  BOOKINGS_MS_URL: {{ .Values.config.bookingsMsUrl | quote }}
  NOTIFICATIONS_MS_URL: {{ .Values.config.notificationsMsUrl | quote }}
  PROPERTIES_MS_URL: {{ .Values.config.propertiesMsUrl | quote }}
  USERS_MS_URL: {{ .Values.config.usersMsUrl | quote }}
  {{- $scheme := .Values.global.publicScheme | default (ternary "https" "http" .Values.global.tls.enabled) }}
  {{- $baseUrl := printf "%s://%s" $scheme .Values.global.domain }}
  STRIPE_SUCCESS_URL: {{ .Values.config.stripeSuccessUrl | default (printf "%s/{locale}/bookings/success" $baseUrl) | quote }}
  STRIPE_CANCEL_URL: {{ .Values.config.stripeCancelUrl | default (printf "%s/{locale}/bookings/cancel" $baseUrl) | quote }}
  STRIPE_CHECKOUT_EXPIRES_MINUTES: {{ .Values.config.stripeCheckoutExpiresMinutes | quote }}
  STRIPE_CONNECT_REFRESH_URI: {{ .Values.config.stripeConnectRefreshUri | default (printf "%s/api/payments/connect/refresh" $baseUrl) | quote }}
  STRIPE_CONNECT_SUCCESS_URL: {{ .Values.config.stripeConnectSuccessUrl | default (printf "%s/admin/settings/payments" $baseUrl) | quote }}
  STRIPE_PLATFORM_FEE_PERCENT: {{ .Values.config.stripePlatformFeePercent | quote }}
  STRIPE_PROCESSING_FEE_PCT: {{ .Values.config.stripeProcessingFeePct | quote }}
  STRIPE_PROCESSING_FEE_FIXED_EUR_CENTS: {{ .Values.config.stripeProcessingFeeFixedEurCents | quote }}
  STRIPE_SUBSCRIPTION_SUCCESS_URL: {{ .Values.config.stripeSubscriptionSuccessUrl | default (printf "%s/{locale}/subscription/success" $baseUrl) | quote }}
  STRIPE_SUBSCRIPTION_CANCEL_URL: {{ .Values.config.stripeSubscriptionCancelUrl | default (printf "%s/{locale}/pricing" $baseUrl) | quote }}
  STRIPE_PORTAL_RETURN_URL: {{ .Values.config.stripePortalReturnUrl | default (printf "%s/{locale}/pricing" $baseUrl) | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
  OTEL_SDK_DISABLED: {{ .Values.config.otelSdkDisabled | quote }}
  FORWARDED_ALLOW_IPS: "*"
