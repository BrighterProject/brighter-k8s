replicaCount: 1
image:
  repository: ghcr.io/brighterproject/brighter-bookings-ms
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 8002
config:
  logLevel: INFO
  usersMsUrl: http://users-ms:8000
  propertiesMsUrl: http://properties-ms:8001
  paymentsMsUrl: http://payments-ms:8003
  notificationsMsUrl: http://notifications-ms:8004
  redisUrl: redis://brighter-redis-master:6379/0
  # Guest check-in flow (BTR-15) grace periods — non-secret.
  checkinTokenGraceDays: "1"
  checkinDispatchLeadDays: "2"
  bookingPurgeWindowDays: "14"
# provides BOOKING_FIELD_ENCRYPTION_KEY, CHECKIN_TOKEN_SECRET, INTERNAL_CRON_SECRET
secrets:
  name: bookings-ms-secrets
# Apply pending Tortoise migrations via an initContainer before the app starts.
migrations:
  enabled: true
# Daily CronJobs driving the guest check-in dispatch + GDPR purge (BTR-15).
# They call the bookings-ms /internal endpoints directly (never via Traefik)
# with the INTERNAL_CRON_SECRET.
cron:
  enabled: true
  image: curlimages/curl:8.11.1
  dispatchSchedule: "0 8 * * *"
  purgeSchedule: "30 3 * * *"
resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
global:
  dbSecretName: brighter-db-app
