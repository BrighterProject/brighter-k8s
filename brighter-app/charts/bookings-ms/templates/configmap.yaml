apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bookings-ms.fullname" . }}-config
  labels:
    {{- include "bookings-ms.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  USERS_MS_URL: {{ .Values.config.usersMsUrl | quote }}
  PROPERTIES_MS_URL: {{ .Values.config.propertiesMsUrl | quote }}
  PAYMENTS_MS_URL: {{ .Values.config.paymentsMsUrl | quote }}
  NOTIFICATIONS_MS_URL: {{ .Values.config.notificationsMsUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
  OTEL_SDK_DISABLED: {{ .Values.config.otelSdkDisabled | quote }}
  FORWARDED_ALLOW_IPS: "*"
  CHECKIN_TOKEN_GRACE_DAYS: {{ .Values.config.checkinTokenGraceDays | quote }}
  CHECKIN_DISPATCH_LEAD_DAYS: {{ .Values.config.checkinDispatchLeadDays | quote }}
  BOOKING_PURGE_WINDOW_DAYS: {{ .Values.config.bookingPurgeWindowDays | quote }}
  CALENDAR_SYNC_FETCH_TIMEOUT: {{ .Values.config.calendarSyncFetchTimeout | quote }}
  CALENDAR_SYNC_JITTER_MS: {{ .Values.config.calendarSyncJitterMs | quote }}
