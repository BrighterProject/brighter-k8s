apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "properties-ms.fullname" . }}-config
  labels:
    {{- include "properties-ms.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  USERS_MS_URL: {{ .Values.config.usersMsUrl | quote }}
  BOOKINGS_MS_URL: {{ .Values.config.bookingsMsUrl | quote }}
  NOTIFICATIONS_MS_URL: {{ .Values.config.notificationsMsUrl | quote }}
  PAYMENTS_MS_URL: {{ .Values.config.paymentsMsUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  R2_ACCOUNT_ID: {{ .Values.config.r2AccountId | quote }}
  R2_BUCKET_NAME: {{ .Values.config.r2BucketName | quote }}
  R2_PUBLIC_URL: {{ .Values.config.r2PublicUrl | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
  OTEL_SDK_DISABLED: {{ .Values.config.otelSdkDisabled | quote }}
  FORWARDED_ALLOW_IPS: "*"
