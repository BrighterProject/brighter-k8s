replicaCount: 1
image:
  repository: ghcr.io/brighterproject/brighter-notifications-ms
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 8004
config:
  logLevel: INFO
  frontendBaseUrl: ""  # derived from global.domain at render time
  redisUrl: redis://brighter-redis-master:6379/0
secrets:
  # provides RESEND_API_KEY
  name: notifications-ms-secrets
# Apply pending Tortoise migrations via an initContainer before the app starts.
migrations:
  enabled: true
resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
global:
  dbSecretName: brighter-db-app
