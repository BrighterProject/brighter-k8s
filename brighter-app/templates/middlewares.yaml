# Shared Traefik middlewares — referenced by all service IngressRoutes.
---
# Strips /api prefix before forwarding to backend services.
# Backend services have no knowledge of the /api path prefix.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-api-strip
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  stripPrefix:
    prefixes:
      - /api

---
# ForwardAuth: Traefik calls users-ms /auth/verify for every protected request.
# On success, users-ms returns X-User-* headers which Traefik injects downstream.
# Downstream services never see or validate the JWT themselves.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-jwt-auth
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  forwardAuth:
    address: "http://users-ms.{{ .Release.Namespace }}.svc.cluster.local:{{ index .Values "users-ms" "service" "port" }}/auth/verify"
    trustForwardHeader: true
    authResponseHeaders:
      - X-User-Id
      - X-Username
      - X-User-Scopes

---
# Strips /admin prefix before forwarding to the admin-panel SPA.
# The SPA is compiled with VITE_BASENAME=/admin so it handles routing internally.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-admin-strip
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  stripPrefix:
    prefixes:
      - /admin

---
# Traefik has no native "deny" action, so external access is blocked by only
# allowing loopback — no real client ever reaches Traefik from 127.0.0.1, so
# this middleware rejects every request that arrives through the edge with a
# 403. Used to explicitly wall off /internal/* paths (e.g. bookings-ms's
# check-in dispatch/purge jobs) at the ingress layer, as defense in depth on
# top of the in-app bearer-secret check — those paths are only ever meant to
# be called pod-to-pod on the cluster network, never through Traefik.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-deny-all
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  ipAllowList:
    sourceRange:
      - "127.0.0.1/32"
