# Production overrides — TLS, resource limits, Redis persistence
global:
  domain: pochivka-na-moreto.bg
  # TLS is terminated by Caddy at the host level; Traefik receives plain HTTP
  # on NodePort 30080 and trusts X-Forwarded-Proto: https from Caddy.
  entryPoint: web
  # Caddy serves the site over https, so externally-visible URLs (Stripe
  # redirects, email links) must use https even though Traefik's entryPoint is
  # plain http and tls.enabled is false.
  publicScheme: https
  tls:
    enabled: false

postgresql:
  instances: 1
  storage:
    size: 50Gi

redis:
  master:
    persistence:
      enabled: true       # persist Redis AOF in prod
      size: 2Gi
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 200m

users-ms:
  replicaCount: 1
  image:
    pullPolicy: Always
  config:
    logLevel: INFO
    cookieSecure: "true"
  resources:
    requests:
      memory: 96Mi
      cpu: 75m
    limits:
      memory: 192Mi
      cpu: 300m

