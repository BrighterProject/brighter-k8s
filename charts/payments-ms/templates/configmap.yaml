apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "payments-ms.fullname" . }}-config
  labels:
    {{- include "payments-ms.labels" . | nindent 4 }}
data:
  BOOKINGS_MS_URL: {{ .Values.config.bookingsMsUrl | quote }}
  {{- $scheme := ternary "https" "http" .Values.global.tls.enabled }}
  {{- $baseUrl := printf "%s://%s" $scheme .Values.global.domain }}
  STRIPE_SUCCESS_URL: {{ .Values.config.stripeSuccessUrl | default (printf "%s/bookings?payment=success" $baseUrl) | quote }}
  STRIPE_CANCEL_URL: {{ .Values.config.stripeCancelUrl | default (printf "%s/bookings?payment=cancelled" $baseUrl) | quote }}
  STRIPE_CHECKOUT_EXPIRES_MINUTES: {{ .Values.config.stripeCheckoutExpiresMinutes | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
