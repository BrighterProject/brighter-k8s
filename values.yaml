# ── Global values (propagated to every subchart as .Values.global.*) ──────────
global:
  domain: xn--80aalycsf6f.xn--90ae
  dbSecretName: brighter-db-app
  entryPoint: web

  tls:
    enabled: false
    certResolver: letsencrypt

redis:
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
  replica:
    replicaCount: 0

postgresql:
  instances: 1
  storage:
    size: 10Gi

  credentialsSecretName: brighter-db-credentials

users-ms:
  replicaCount: 1
  image:
    repository: ghcr.io/brighterproject/brighter-users-ms
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8000
  config:
    logLevel: INFO
    accessTokenExpireMinutes: "120"
    redisUrl: redis://brighter-redis-master:6379/0
    contactEmail: brighter.bg@gmail.com
    contactRateLimit: "5"
    contactRateWindow: "3600"
    smtpHost: smtp.gmail.com
    smtpPort: "587"
    notificationsMsUrl: http://notifications-ms:8004
    cookieSecure: "false"
  secrets:
    # provides SECRET_KEY, GOOGLE_CLIENT_ID, SMTP_USER, SMTP_PASSWORD, TURNSTILE_SECRET_KEY
    name: users-ms-secrets
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

properties-ms:
  replicaCount: 1
  image:
    repository: ghcr.io/brighterproject/brighter-properties-ms
    tag: latest
    pullPolicy: IfNotPresent
